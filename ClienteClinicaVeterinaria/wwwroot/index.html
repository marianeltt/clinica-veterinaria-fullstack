<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#183b36">

    <title>VetCare | Clínica Veterinária</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="app-shell">

    <aside class="sidebar">

        <a class="brand" href="#" data-view="dashboard">
            <span class="brand-mark">✚</span>

            <span class="brand-name">
                vetcare
                <small>CLÍNICA VETERINÁRIA</small>
            </span>
        </a>

        <div class="nav-label">MENU PRINCIPAL</div>

        <nav class="side-nav">

            <button class="nav-link active" data-view="dashboard">
                <span class="nav-icon">⌂</span>
                Visão geral
            </button>

            <button class="nav-link" data-view="tutores">
                <span class="nav-icon">♙</span>
                Tutores
            </button>

            <button class="nav-link" data-view="animais">
                <span class="nav-icon">🐾</span>
                Animais
            </button>

            <button class="nav-link" data-view="consultas">
                <span class="nav-icon">▦</span>
                Consultas
            </button>

            <button class="nav-link" data-view="historico">
                <span class="nav-icon">▤</span>
                Histórico clínico
            </button>

        </nav>

        <div class="sidebar-bottom">

            <div class="api-status" id="apiStatus">
                <span class="status-dot"></span>
                <span id="apiStatusText">Conectando à API...</span>
            </div>

            <div class="sidebar-note">
                Sistema de gerenciamento<br>
                ASP.NET Core · PostgreSQL
            </div>

        </div>

    </aside>


    <main class="main-area">

        <header class="topbar">

            <div>
                <div class="eyebrow">GESTÃO DA CLÍNICA</div>
                <h1 id="pageTitle">Visão geral</h1>
            </div>

            <div class="topbar-right">

                <span class="today" id="currentDate"></span>

                <button
                        class="icon-button refresh-button"
                        id="refreshBtn"
                        title="Atualizar dados">
                    ↻
                </button>

                <div class="profile-chip">
                    <span class="profile-avatar">V</span>

                    <span>
                        <strong>Equipe VetCare</strong>
                        <small>Administrador</small>
                    </span>
                </div>

            </div>

        </header>


        <section class="page-content" id="content"></section>


        <footer class="footer">
            VetCare <span>•</span>
            Cuidando de quem faz parte da família.
        </footer>

    </main>

</div>


<!-- MODAL DOS FORMULÁRIOS -->

<div class="modal-backdrop hidden" id="modalBackdrop">

    <section class="modal-card" role="dialog" aria-modal="true">

        <div class="modal-header">

            <div>
                <span class="eyebrow">FORMULÁRIO</span>

                <h2 id="modalTitle">Novo cadastro</h2>

                <p id="modalSubtitle">
                    Preencha as informações abaixo.
                </p>
            </div>

            <button
                    class="icon-button close-button"
                    type="button"
                    id="closeModal">
                ×
            </button>

        </div>

        <form id="recordForm">

            <div class="form-grid" id="modalFields"></div>

            <div class="modal-actions">

                <button
                        type="button"
                        class="button secondary"
                        id="cancelModal">
                    Cancelar
                </button>

                <button type="submit" class="button primary">
                    Salvar informações
                </button>

            </div>

        </form>

    </section>

</div>


<div class="toast-container" id="toastContainer"></div>


<script src="js/app.js"></script>

</body>
</html>
